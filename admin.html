<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雲科大通識中心 - 網站後台管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans min-h-screen flex flex-col">

    <!-- 頂部導覽列 -->
    <header class="bg-slate-900 text-white shadow-md">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-gauge-high text-emerald-400 text-2xl"></i>
                <h1 class="text-xl font-bold tracking-wider">通識教育中心 • 內容管理後台</h1>
            </div>
            <div id="user-info" class="hidden flex items-center space-x-4">
                <span id="username-display" class="text-sm text-gray-300"></span>
                <button onclick="logout()" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded text-sm transition">登出</button>
            </div>
        </div>
    </header>

    <!-- 登入畫面 -->
    <div id="login-container" class="flex-grow flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-xl shadow-lg max-w-md w-full border border-gray-200">
            <div class="text-center mb-6">
                <div class="bg-emerald-100 text-emerald-600 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <h2 class="text-2xl font-bold text-gray-800">管理者權限驗證</h2>
                <p class="text-sm text-gray-500 mt-1">請輸入 GitHub 帳號白名單驗證與 Personal Access Token</p>
            </div>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">GitHub 帳號 (Username)</label>
                    <input type="text" id="gh-user" required placeholder="例如: your-github-id" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">GitHub Personal Access Token (PAT)</label>
                    <input type="password" id="gh-token" required placeholder="ghp_xxxxxxxxxxxx" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    <p class="text-xs text-gray-400 mt-1">需具備 repo 讀寫權限（Fine-grained token 需 Contents: read & write）</p>
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 rounded-lg transition">安全登入後台</button>
            </form>
        </div>
    </div>

    <!-- 編輯主畫面 (預設隱藏) -->
    <main id="dashboard-container" class="hidden flex-grow container mx-auto px-6 py-8 space-y-8">
        <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-gray-200">
            <div>
                <h3 class="text-lg font-bold text-gray-800">公告內容管理</h3>
                <p class="text-sm text-gray-500">在此新增或刪除最新消息與課程公告，完成後點擊右側按鈕同步至 GitHub。</p>
            </div>
            <button onclick="saveToGitHub()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-lg shadow font-medium flex items-center space-x-2 transition">
                <i class="fa-solid fa-cloud-arrow-up"></i>
                <span>儲存並發布至 GitHub</span>
            </button>
        </div>

        <!-- 最新消息編輯區 -->
        <section class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
            <div class="flex justify-between items-center mb-4">
                <h4 class="text-md font-bold text-gray-800"><i class="fa-solid fa-bullhorn text-emerald-600 mr-2"></i>最新消息 (News)</h4>
                <button onclick="addItem('news')" class="bg-blue-600 hover:bg-blue-700 text-white text-sm px-3 py-1.5 rounded transition"><i class="fa-solid fa-plus mr-1"></i>新增消息</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse" id="news-table">
                    <thead>
                        <tr class="bg-gray-50 border-b text-sm text-gray-600">
                            <th class="p-3">日期</th>
                            <th class="p-3">標籤</th>
                            <th class="p-3">標題</th>
                            <th class="p-3">連結網址</th>
                            <th class="p-3 text-center">操作</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y text-sm"></tbody>
                </table>
            </div>
        </section>

        <!-- 課程公告編輯區 -->
        <section class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
            <div class="flex justify-between items-center mb-4">
                <h4 class="text-md font-bold text-gray-800"><i class="fa-solid fa-book-open text-emerald-600 mr-2"></i>課程公告 (Class Announcements)</h4>
                <button onclick="addItem('classes')" class="bg-blue-600 hover:bg-blue-700 text-white text-sm px-3 py-1.5 rounded transition"><i class="fa-solid fa-plus mr-1"></i>新增公告</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse" id="classes-table">
                    <thead>
                        <tr class="bg-gray-50 border-b text-sm text-gray-600">
                            <th class="p-3">日期</th>
                            <th class="p-3">標籤</th>
                            <th class="p-3">標題</th>
                            <th class="p-3">連結網址</th>
                            <th class="p-3 text-center">操作</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y text-sm"></tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- 簡易 JavaScript 邏輯：串接 GitHub API 與資料綁定 -->
    <script>
        // 【設定】請填入你的 GitHub 資訊
        const REPO_OWNER = "your-github-username"; // 你的 GitHub 帳號
        const REPO_NAME = "yuntech-general-edu";    // 你的專案 Repository 名稱
        const FILE_PATH = "data.json";              // 資料檔案路徑
        const ALLOWED_ADMINS = ["your-github-username", "editor123"]; // 允許登入的白名單帳號

        let siteData = { news: [], classes: [] };
        let authToken = "";
        let currentUsername = "";

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('gh-user').value.trim();
            const token = document.getElementById('gh-token').value.trim();

            // 檢查白名單
            if (!ALLOWED_ADMINS.includes(username)) {
                alert("錯誤：此 GitHub 帳號不在管理者白名單內！");
                return;
            }

            // 驗證 Token 是否有效
            try {
                const res = await fetch(`https://api.github.com/user`, {
                    headers: { Authorization: `token ${token}` }
                });
                if (!res.ok) throw new Error("Token 驗證失敗");
                
                authToken = token;
                currentUsername = username;
                
                document.getElementById('login-container').classList.add('hidden');
                document.getElementById('dashboard-container').classList.remove('hidden');
                document.getElementById('user-info').classList.remove('hidden');
                document.getElementById('username-display').innerText = `登入者: ${username}`;

                loadDataFromGitHub();
            } catch (err) {
                alert("登入失敗，請檢查 GitHub 帳號或 Token 是否正確！");
            }
        }

        function logout() {
            location.reload();
        }

        async function loadDataFromGitHub() {
            try {
                const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
                    headers: { Authorization: `token ${authToken}` }
                });
                const result = await res.json();
                const content = JSON.parse(decodeURIComponent(escape(atob(result.content))));
                siteData = content;
                renderTables();
            } catch (err) {
                alert("讀取遠端資料失敗，請確認 Repository 設定是否正確。");
            }
        }

        function renderTables() {
            renderTable('news', siteData.news);
            renderTable('classes', siteData.classes);
        }

        function renderTable(type, items) {
            const tbody = document.querySelector(`#${type}-table tbody`);
            tbody.innerHTML = "";
            items.forEach((item, index) => {
                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50">
                        <td class="p-3"><input type="date" value="${item.date}" onchange="updateItem('${type}', ${index}, 'date', this.value)" class="border rounded px-2 py-1"></td>
                        <td class="p-3"><input type="text" value="${item.badge}" onchange="updateItem('${type}', ${index}, 'badge', this.value)" class="border rounded px-2 py-1 w-24"></td>
                        <td class="p-3"><input type="text" value="${item.title}" onchange="updateItem('${type}', ${index}, 'title', this.value)" class="border rounded px-2 py-1 w-full"></td>
                        <td class="p-3"><input type="text" value="${item.link}" onchange="updateItem('${type}', ${index}, 'link', this.value)" class="border rounded px-2 py-1 w-full"></td>
                        <td class="p-3 text-center">
                            <button onclick="deleteItem('${type}', ${index})" class="text-red-500 hover:text-red-700 px-2 py-1"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });
        }

        function updateItem(type, index, field, value) {
            siteData[type][index][field] = value;
        }

        function addItem(type) {
            const newItem = {
                id: Date.now(),
                title: "新公告標題",
                date: new Date().toISOString().split('T')[0],
                badge: "公告",
                link: "#"
            };
            siteData[type].unshift(newItem);
            renderTables();
        }

        function deleteItem(type, index) {
            if (confirm("確定要刪除這筆公告嗎？")) {
                siteData[type].splice(index, 1);
                renderTables();
            }
        }

        async function saveToGitHub() {
            if (!confirm("確定要將變更發布至 GitHub 網站嗎？")) return;

            try {
                // 1. 先取得檔案目前的 SHA (GitHub API 更新檔案必要參數)
                const getRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
                    headers: { Authorization: `token ${authToken}` }
                });
                const fileInfo = await getRes.json();
                const fileSha = fileInfo.sha;

                // 2. 將更新後的資料編碼並上傳
                const updatedContent = btoa(unescape(encodeURIComponent(JSON.stringify(siteData, null, 2))));
                const putRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
                    method: 'PUT',
                    headers: {
                        Authorization: `token ${authToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Update website content via admin panel by ${currentUsername}`,
                        content: updatedContent,
                        sha: fileSha
                    })
                });

                if (putRes.ok) {
                    alert("🎉 成功發布！網站將在數十秒內完成 GitHub Pages 自動重新部署。");
                } else {
                    throw new Error("發布失敗");
                }
            } catch (err) {
                alert("發布失敗，請檢查 Token 權限或網路狀態。");
            }
        }
    </script>
</body>
</html>
